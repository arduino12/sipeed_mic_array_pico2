; ============================================================================
; sipeed_mic_array_pico2 -- Sipeed R6+1 mic array on a Raspberry Pi Pico 2
;
;   Composite USB device:
;     - UAC2 microphone (stereo beam+centre, or 8-ch raw; switch with `mode`)
;     - CDC serial: direction-of-arrival telemetry + command console
;   12x SK9822 ring shows the sound direction.
;
;   Two boards, same firmware (pins in src/config.h):
;     pio run -e pico2   Raspberry Pi Pico 2: CK GP10, WS GP11, D0-D3 GP12-15, LED GP18/19
;     pio run -e zero    Waveshare RP2350-Zero: CK GP0, WS GP1, D0-D3 GP2-5, LED GP6/7
;     VIN -> 5 V (VBUS), GND -> GND
;
; USB stack: Adafruit TinyUSB (bundled with the earlephilhower core) because
; the core's built-in stack is precompiled without the audio class. The audio
; class is switched on with the CFG_TUD_AUDIO_* flags below; the descriptor
; and callbacks live in src/usb_audio.cpp.
;
; Clock: 153.6 MHz = 48 kHz * 64 BCK * 2 PIO cycles * 25, so the I2S clock
; divider is an exact integer (no fractional-divider jitter on BCK).
; ============================================================================

[platformio]
default_envs = pico2

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 153600000L

; The core appends -Os after build_flags, which would win over -O2 and
; spill the DSP loops' accumulators to the stack.
build_unflags = -Os
build_flags =
    -O2
    ; lets sqrtf() compile to a single VSQRT
    -fno-math-errno
    ; newlib-nano drops %f from printf unless asked; the console prints floats
    -Wl,-u,_printf_float
    -DUSE_TINYUSB
    -DCFG_TUD_AUDIO=1
    -DCFG_TUD_AUDIO_ENABLE_EP_IN=1
    -DCFG_TUD_AUDIO_EP_IN_FLOW_CONTROL=1
    ; largest packet over both modes: raw8 = 49 frames * 8 ch * 2 B
    -DCFG_TUD_AUDIO_FUNC_1_EP_IN_SZ_MAX=784
    -DCFG_TUD_AUDIO_FUNC_1_EP_IN_SW_BUF_SZ=6272
    -DCFG_TUD_AUDIO_CTRL_BUF_SZ=64
    ; The core's sdkoverride/*.c still include pico-sdk's TinyUSB 0.18 headers,
    ; which insist on these. Only the Adafruit copy (0.20) runs the audio class.
    -DCFG_TUD_AUDIO_FUNC_1_DESC_LEN=127
    -DCFG_TUD_AUDIO_FUNC_1_N_AS_INT=1
    -DCFG_TUD_AUDIO_FUNC_1_CTRL_BUF_SZ=64

; picotool has no WinUSB driver on this machine: tools/flash.py does the
; 1200 bps touch and copies the UF2 to the RP2350 drive instead.
upload_protocol = picotool
monitor_speed = 115200

[env:pico2]
board = rpipico2

[env:zero]
board = waveshare_rp2350_zero
